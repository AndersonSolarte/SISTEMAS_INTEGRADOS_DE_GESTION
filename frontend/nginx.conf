log_format siac_safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
access_log /var/log/nginx/access.log siac_safe;

server {
  listen 80;
  server_name planeaciongp.unicesmag.edu.co _;
  server_tokens off;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name planeaciongp.unicesmag.edu.co _;
  server_tokens off;

  # Las restauraciones administrativas pueden incluir PostgreSQL y el volumen
  # completo de archivos institucionales. Multer mantiene el limite final.
  client_max_body_size 22g;
  client_body_timeout 3600s;
  client_header_timeout 3600s;
  client_body_buffer_size 16m;

  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/Cert_planeacion.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;


  include /etc/nginx/snippets/siac-security-headers.conf;

  location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~* \.(env|ini|log|bak|backup|siacbackup|enc|sha256|old|orig|sql|sqlite|db|dump|pem|key|crt|p12|pfx|config|ya?ml|zip|tar|gz|map)$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  location = /index.html {
    include /etc/nginx/snippets/siac-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;
  }

  location ~* ^/(backend|python-service|node_modules|src|scripts|config|backups|db)(/|$) {
    return 404;
  }

  location ~* ^/(package(-lock)?\.json|Dockerfile|docker-compose[^/]*|AGENTS\.md|deploy\.sh)$ {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
