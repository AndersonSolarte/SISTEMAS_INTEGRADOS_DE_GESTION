services:
  db:
    image: postgres:16-alpine
    container_name: sgc-db
    profiles: ["docker-db"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: sgc-python-service
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    environment:
      TMPDIR: /tmp
      FRONTEND_URL: ${PUBLIC_APP_URL}
      DB_HOST: ${HOST_DB_HOST:-host.docker.internal}
      DB_PORT: ${HOST_DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgc-backend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      PORT: 5000
      NODE_ENV: production
      HOME: /tmp
      TMPDIR: /tmp
      DB_HOST: ${HOST_DB_HOST:-host.docker.internal}
      DB_PORT: ${HOST_DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-8h}
      ENFORCE_TOKEN_VERSION: ${ENFORCE_TOKEN_VERSION:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-300000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-900}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-300000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-40}
      PUBLIC_RATE_LIMIT_WINDOW_MS: ${PUBLIC_RATE_LIMIT_WINDOW_MS:-300000}
      PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-80}
      EXCEL_UPLOAD_MAX_MB: ${EXCEL_UPLOAD_MAX_MB:-50}
      DOCX_UPLOAD_MAX_MB: ${DOCX_UPLOAD_MAX_MB:-25}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      URLENCODED_BODY_LIMIT: ${URLENCODED_BODY_LIMIT:-256kb}
      REQUEST_MAX_FIELD_LENGTH: ${REQUEST_MAX_FIELD_LENGTH:-8000}
      FRONTEND_URL: ${PUBLIC_APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      INSTITUTIONAL_EMAIL_DOMAIN: ${INSTITUTIONAL_EMAIL_DOMAIN:-unicesmag.edu.co}
      AUTH_GOOGLE_ONLY: ${AUTH_GOOGLE_ONLY:-true}
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
      GOOGLE_SHEETS_TAB: ${GOOGLE_SHEETS_TAB:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: /app/keys/google-service-account.json
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      ENABLE_REPORTE_SALIDA_FORM: ${ENABLE_REPORTE_SALIDA_FORM:-false}
      REPORTE_SALIDA_GESTION_HUMANA_EMAIL: ${REPORTE_SALIDA_GESTION_HUMANA_EMAIL:-adsolarte@unicesmag.edu.co}
      REPORTE_SALIDA_SST_EMAIL: ${REPORTE_SALIDA_SST_EMAIL:-gp.planeacion@unicesmag.edu.co}
      REPORTE_SALIDA_TEMPLATE_PATH: ${REPORTE_SALIDA_TEMPLATE_PATH:-}
      SABER_PRO_PYTHON_URL: http://python-service:8000
      SABER_PRO_PYTHON_TIMEOUT_MS: ${SABER_PRO_PYTHON_TIMEOUT_MS:-15000}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-7000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SIAC_AUTOMATIC_BACKUP_ENABLED: ${SIAC_AUTOMATIC_BACKUP_ENABLED:-true}
      SIAC_BACKUP_STORAGE_DIR: /app/automatic-backups
      SIAC_BACKUP_HOUR: ${SIAC_BACKUP_HOUR:-18}
      SIAC_BACKUP_MINUTE: ${SIAC_BACKUP_MINUTE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      python-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT_HOST:-5000}:5000"
    volumes:
      - backend_uploads:/app/uploads
      - ./backend/keys:/app/keys:ro
      - ${SIAC_BACKUP_DIR:-./backups}:/app/automatic-backups
    tmpfs:
      - /tmp:size=512m,nosuid,nodev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_NAME: ${REACT_APP_NAME:-Sistema de Gestion de Calidad}
        REACT_APP_VERSION: ${REACT_APP_VERSION:-1.0.0}
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        REACT_APP_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        REACT_APP_ENABLE_REPORTE_SALIDA_FORM: ${REACT_APP_ENABLE_REPORTE_SALIDA_FORM:-false}
    container_name: sgc-frontend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT_HOST:-8080}:80"
      - "${FRONTEND_SSL_PORT_HOST:-443}:443"
    volumes:
      - ./fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./Cert_planeacion.key:/etc/nginx/certs/Cert_planeacion.key:ro
    tmpfs:
      - /var/cache/nginx:size=64m,nosuid,nodev
      - /var/run:size=16m,nosuid,nodev
      - /tmp:size=64m,noexec,nosuid,nodev

volumes:
  postgres_data:
  backend_uploads:
